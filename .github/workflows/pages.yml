name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Static export (next.config.ts: output "export", basePath "/about-me") writes the site to out/.
      - name: Build the static export
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # v4+ drops dotfiles by default; .nojekyll must ship.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
