name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      # Deny-list, not allow-list: new site files at the repo root publish without editing this workflow.
      - name: Stage public files into _site
        run: |
          printf '%s\n' .git .github .claude .agents .fredrin README.md _site > "$RUNNER_TEMP/pages-exclude"
          mkdir -p _site
          rsync -a --exclude-from="$RUNNER_TEMP/pages-exclude" ./ _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ drops dotfiles by default; .nojekyll must ship.
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
